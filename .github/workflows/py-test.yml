
name: Python test

on: [push]

jobs:
  test:

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - run: df -h
    - name: "node-cleanup"
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        # sudo docker image prune --all --force
        # sudo docker builder prune -a
    - run: df -h

    - uses: actions/checkout@v4

    - name: Test Python environment
      run: |
        set -x
        bash test/scripts/run-docker-test.sh -- \
          /opt/conda/envs/env/bin/python -c \
          'import scanpy, mudata, anndata, scipy; print("Dependencies OK")'

        
    - name: Test python scripts
      run: |
        set -x
        files=(test/scripts/python/test-*.py)
        for f in "${files[@]}"
        do
          bash test/scripts/run-docker-test.sh "$f"
        done
