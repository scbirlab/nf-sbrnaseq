
name: Nextflow test

on: [push]

jobs:
  test:

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - run: df -h
    - name: "node-cleanup"
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        # sudo docker image prune --all --force
        # sudo docker builder prune -a
    - run: df -h
    - uses: actions/checkout@v4
    - uses: nf-core/setup-nextflow@v1
      with:
        version: 23
    - name: Test Nextflow pipeline - ONT
      run: |
        set -x
        bash test/run-tests-ont.sh gh
    - name: Test Nextflow pipeline - Illumina
      run: |
        set -x
        bash test/run-tests-illumina.sh gh ecoli
    - name: Test Nextflow pipeline - Barnyard
      run: |
        set -x
        bash test/run-tests-illumina.sh gh barnyard
